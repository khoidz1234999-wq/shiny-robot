                  upd = { bs.forEachIndexed { i, b -> b.alpha = if (P.i(this, k, d) == i) 1f else .45f } }
                  upd(); c.addView(r); col.addView(c)
              }
              private fun startSvc() {
                  if (Settings.canDrawOverlays(this)) ContextCompat.startForegroundService(this, Intent(this, FloatingService::class.java))
