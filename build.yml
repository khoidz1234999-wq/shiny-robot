          cat > app/src/main/java/com/liquid/assist/Views.kt <<'EOF_7'
          package com.liquid.assist
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.view.View
          import android.view.animation.DecelerateInterpolator

          /** Kính lỏng: nền mờ + highlight bán kính + viền sáng chuyển màu */
          class Glass(c: Context, private val tint: Int = 0, private val rad: Float = -1f) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private fun a(x: Int) = Color.argb(x, 255, 255, 255)
              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  val r = if (rad < 0) minOf(w, h) / 2 else rad
                  val rc = RectF(2f, 2f, w - 2f, h - 2f)
                  p.style = Paint.Style.FILL
                  if (tint != 0) { p.shader = null; p.color = tint; cv.drawRoundRect(rc, r, r, p) }
                  p.shader = LinearGradient(0f, 0f, 0f, h, intArrayOf(a(70), a(22), a(46)), null, Shader.TileMode.CLAMP)
                  cv.drawRoundRect(rc, r, r, p)
                  p.shader = RadialGradient(w * .28f, h * .18f, maxOf(w, h) * .75f, a(95), a(0), Shader.TileMode.CLAMP)
                  cv.drawRoundRect(rc, r, r, p)
                  p.style = Paint.Style.STROKE; p.strokeWidth = 2.5f
                  p.shader = LinearGradient(0f, 0f, w, h, intArrayOf(a(230), a(20), a(150)), null, Shader.TileMode.CLAMP)
                  cv.drawRoundRect(rc, r, r, p)
              }
          }

          /** Thanh âm lượng dọc kiểu iOS: fill trắng từ dưới lên + loa đổi sóng theo mức */
          class VolBar(c: Context) : View(c) {
              var level = 0f
              private var anim: ValueAnimator? = null
              private val fp = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ip = Paint(Paint.ANTI_ALIAS_FLAG)
              fun go(t: Float, d: Long, instant: Boolean = false) {
                  anim?.cancel()
                  if (instant) { level = t; invalidate(); return }
                  anim = ValueAnimator.ofFloat(level, t).apply {
                      duration = d; interpolator = DecelerateInterpolator()
                      addUpdateListener { level = it.animatedValue as Float; invalidate() }; start()
                  }
              }
              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  val clip = Path().apply { addRoundRect(RectF(0f, 0f, w, h), w / 2, w / 2, Path.Direction.CW) }
                  cv.save(); cv.clipPath(clip)
                  fp.shader = LinearGradient(0f, 0f, 0f, h, Color.argb(250, 255, 255, 255), Color.argb(215, 232, 238, 255), Shader.TileMode.CLAMP)
                  cv.drawRect(0f, h * (1 - level), w, h, fp)
                  cv.restore()
                  val s = w * .12f; val cx = w / 2 - s * 1.25f; val cy = h - w * .52f
                  ip.shader = null
                  ip.color = if (level > .12f) Color.argb(215, 40, 44, 60) else Color.WHITE
                  ip.style = Paint.Style.FILL
                  val p = Path()
                  p.moveTo(cx - s * 1.3f, cy - s * .7f); p.lineTo(cx - s * .5f, cy - s * .7f); p.lineTo(cx + s * .5f, cy - s * 1.5f)
                  p.lineTo(cx + s * .5f, cy + s * 1.5f); p.lineTo(cx - s * .5f, cy + s * .7f); p.lineTo(cx - s * 1.3f, cy + s * .7f); p.close()
                  cv.drawPath(p, ip)
                  ip.style = Paint.Style.STROKE; ip.strokeWidth = s * .45f; ip.strokeCap = Paint.Cap.ROUND
                  val n = when { level <= 0f -> 0; level < .34f -> 1; level < .67f -> 2; else -> 3 }
                  for (i in 1..n) {
                      val r = s * (.9f + .8f * i)
                      cv.drawArc(RectF(cx + s * .5f - r, cy - r, cx + s * .5f + r, cy + r), -42f, 84f, false, ip)
                  }
                  if (n == 0) cv.drawLine(cx + s * 1.2f, cy - s * .8f, cx + s * 2.4f, cy + s * .8f, ip)
              }
          }
