                  perm("Trợ năng", "Để Home/Quay lại/Đa nhiệm/Thông báo/Khóa/Chụp màn hình và bắt phím âm lượng cứng.",
                      { AccSvc.i != null }) { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  perm("Không giới hạn pin", "Giúp Home ảo không bị hệ thống tắt.",
                      { (getSystemService(POWER_SERVICE) as PowerManager).isIgnoringBatteryOptimizations(packageName) }) {
